<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#17120E" />
    <meta name="description" content="Spaced-repetition chess puzzles from your own games." />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <title>chessfsrs</title>
    <script>
      // Pick light or dark before the first paint; src/lib/theme.ts takes over once the app loads.
      try {
        var t = localStorage.getItem("chessfsrs.theme");
        if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        document.documentElement.dataset.theme = t;
        document.querySelector('meta[name="theme-color"]').content = t === "light" ? "#f1e6cb" : "#17120e";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
